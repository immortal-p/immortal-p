name: Generate Snake Animation

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: Platane/snk/svg-only@v3
        id: snake-svg
        with:
          github_user_name: immortal-p
          outputs: |
            dist/snake.svg
            dist/github-contribution-grid-snake-custom.svg?color_snake=%2300eaff&color_dots=%2300ff41,%23ffffff&stroke=%23030303&background=%230d1117

      - name: Deploy snake animation
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
